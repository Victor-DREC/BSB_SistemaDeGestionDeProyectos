spring.application.name=proyectos

spring.datasource.url=jdbc:postgresql://localhost:5433/proyectos_db
spring.datasource.username=postgres
spring.datasource.password=Alexander2412

#Driver
spring.datasource.driver-class-name=org.postgresql.Driver

#Hibrnate crea y actualiza la tabla automaticamente
spring.jpa.hibernate.ddl-auto=update

#Mostrar SQL en consola
spring.jpa.show-sql=true

#Formatear SQL
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

#Logs de Spring
logging.level.org.springframework=INFO

#Logs de Hibernate SQL
logging.level.org.hibernate.SQL=DEBUG

#Mostrar parametros SQL
logging.level.org.hibernate.orm.jdbc.bind=TRACE

